[project]
name = "concur"
version = "0.1.0"
description = "SAP Concur expense report receipt checker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "exchangelib>=5.4.3",
    "msal>=1.31.0",
    "azure-ai-formrecognizer>=3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
